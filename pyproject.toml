[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shiliu"
version = "0.4.0"
description = "A local Bilibili favorites reading pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jieba==0.42.1",
  "numpy>=1.26,<3",
  "keyring>=25,<26",
  "langgraph>=1.2.10,<1.3",
  "markdown>=3.7,<4",
  "mcp==2.2.0",
  "openai>=2,<3",
  "pydantic>=2.9,<3",
  "tomli>=2,<3; python_version < '3.11'",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.3,<4",
  "psycopg-pool>=3.3,<4",
  "pgvector>=0.4,<1",
  "alembic>=1.17,<2",
]

[project.optional-dependencies]
qwen = [
  "sentence-transformers>=2.7,<6",
  "torch>=2.6,<3",
  "transformers>=4.51,<6",
]
test = [
  "pytest>=8.3,<9",
]

[project.scripts]
shiliu = "shiliu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shiliu"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/env.py" = "shiliu/migration/alembic/env.py"
"migrations/README.md" = "shiliu/migration/alembic/README.md"
"migrations/sql" = "shiliu/migration/alembic/sql"
"migrations/contracts" = "shiliu/migration/alembic/contracts"
"migrations/versions/0001_scope_core.py" = "shiliu/migration/alembic/versions/0001_scope_core.py"
"migrations/versions/0002_agent_domains.py" = "shiliu/migration/alembic/versions/0002_agent_domains.py"
"migrations/versions/0003_retrieval_artifacts.py" = "shiliu/migration/alembic/versions/0003_retrieval_artifacts.py"
"migrations/versions/0004_backfill_scope.py" = "shiliu/migration/alembic/versions/0004_backfill_scope.py"
"migrations/versions/0005_dispatch_input_identity.py" = "shiliu/migration/alembic/versions/0005_dispatch_input_identity.py"
"migrations/versions/0006_research_reuse_scope.py" = "shiliu/migration/alembic/versions/0006_research_reuse_scope.py"
"migrations/versions/0007_collection_profiles.py" = "shiliu/migration/alembic/versions/0007_collection_profiles.py"
"migrations/versions/0008_dispatch_release.py" = "shiliu/migration/alembic/versions/0008_dispatch_release.py"
"migrations/versions/0009_research_ancestor_attempts.py" = "shiliu/migration/alembic/versions/0009_research_ancestor_attempts.py"

"migrations/versions/0010_research_control_lineage.py" = "shiliu/migration/alembic/versions/0010_research_control_lineage.py"

"migrations/versions/0011_research_candidate_boundary.py" = "shiliu/migration/alembic/versions/0011_research_candidate_boundary.py"
"migrations/versions/0012_collection_chunk_bm25.py" = "shiliu/migration/alembic/versions/0012_collection_chunk_bm25.py"
"migrations/versions/0013_assistant_notifications.py" = "shiliu/migration/alembic/versions/0013_assistant_notifications.py"
"migrations/versions/0014_assistant_source_patch.py" = "shiliu/migration/alembic/versions/0014_assistant_source_patch.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q -m 'not external_artifact and not live_provider'"
markers = [
  "external_artifact: requires an intentionally external historical artifact or workspace",
  "live_provider: requires live credentials and a networked model provider",
  "historical_contract: preserved historical assertion excluded from the current deterministic baseline",
]
